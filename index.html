<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskflow</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; }
      .boot-loader { display: grid; place-items: center; height: 100vh; }
      .boot-loader span { width: 28px; height: 28px; border: 3px solid rgba(46, 230, 182, 0.2); border-top-color: #2ee6b6; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-loader span { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" aria-hidden="true"><span></span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
